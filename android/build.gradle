allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.remove("-Werror")
        options.compilerArgs.add("-Xlint:-options")
    }
}

rootProject.allprojects {
    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.AppPlugin" == plugin.class.name || "com.android.build.gradle.LibraryPlugin" == plugin.class.name) {
            project.android {
                compileSdkVersion 33
            }
        }
    }
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.fragment' && details.requested.name == 'fragment') {
                details.useVersion "1.6.2"
            }
            if (details.requested.group == 'androidx.activity' && details.requested.name == 'activity') {
                details.useVersion "1.7.2"
            }
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion "2.6.2"
            }
            if (details.requested.group == 'androidx.core' && details.requested.name.startsWith('core')) {
                details.useVersion "1.10.1"
            }
            if (details.requested.group == 'androidx.window') {
                details.useVersion "1.1.0"
            }
            if (details.requested.group == 'androidx.annotation' && details.requested.name == 'annotation-experimental') {
                details.useVersion "1.3.0"
            }
        }
    }
}



tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
